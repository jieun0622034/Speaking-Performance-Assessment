server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never
spring:
  application:
    name: speaking-assessment-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

studio:
  media-directory: ${MEDIA_DIRECTORY:./data/media}
