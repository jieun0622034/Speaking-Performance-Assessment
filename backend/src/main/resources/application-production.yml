server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 2h
      cookie:
        secure: true
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
studio:
  media-directory: ${MEDIA_DIRECTORY}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
